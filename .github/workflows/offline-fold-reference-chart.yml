name: Offline Fold Reference Chart Audit
on:
  push:
    branches:
      - research/vein-pinchout-parity-20261017
    paths:
      - .github/workflows/offline-fold-reference-chart.yml
      - benchmarks/vein_parity/fold_chart_audit.py
      - benchmarks/vein_parity/test_fold_chart_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy shapely trimesh
      - run: cd benchmarks/vein_parity && python -m unittest -v test_fold_chart_audit.py
