name: Offline vein segment orientation and multiple-hit hypotheses

on:
  push:
    branches: [research/vein-pinchout-parity-20261017]
    paths:
      - benchmarks/vein_parity/vein_segment_orientation.py
      - benchmarks/vein_parity/test_vein_segment_orientation.py
      - .github/workflows/offline-vein-segment-orientation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent geometry packages
        run: python -m pip install numpy trimesh scipy
      - name: Test wall orientation and candidate multi-hit policies
        run: python benchmarks/vein_parity/test_vein_segment_orientation.py
