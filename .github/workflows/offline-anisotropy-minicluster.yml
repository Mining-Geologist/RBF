name: Offline anisotropy mini-clustering test

on:
  push:
    branches: [research/structural-tensor-inversion-20261016]
    paths:
      - 'benchmarks/leapfrog_gold/anisotropy_minicluster_stage.py'
      - 'benchmarks/leapfrog_gold/test_anisotropy_minicluster_stage.py'
      - '.github/workflows/offline-anisotropy-minicluster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-synthetic:
    name: Offline synthetic mini-cluster tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Verify bounded and deterministic two-stage merges
        run: python benchmarks/leapfrog_gold/test_anisotropy_minicluster_stage.py
