name: Offline native-style vein thickness constraint
on:
  push:
    branches:
      - research/vein-pinchout-parity-20261017
    paths:
      - 'benchmarks/vein_parity/native_wall_thickness_clamp.py'
      - 'benchmarks/vein_parity/test_native_wall_thickness_clamp.py'
      - '.github/workflows/offline-native-wall-thickness-clamp.yml'
  workflow_dispatch:
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Verify symmetric bounds, midpoint, unconstrained behavior
        working-directory: benchmarks/vein_parity
        run: python -m unittest -v test_native_wall_thickness_clamp.py
