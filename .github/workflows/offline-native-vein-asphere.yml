name: Offline native saved FastRBF asphere verification

on:
  push:
    branches: [research/vein-pinchout-parity-20261017]
    paths:
      - benchmarks/vein_parity/replay_saved_asphere.py
      - benchmarks/vein_parity/test_replay_saved_asphere.py
      - .github/workflows/offline-native-vein-asphere.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-maths:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - run: python benchmarks/vein_parity/test_replay_saved_asphere.py
