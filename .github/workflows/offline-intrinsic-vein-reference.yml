name: Offline vein reference metric and drift audit
on:
  push:
    branches:
      - research/vein-pinchout-parity-20261017
    paths:
      - 'benchmarks/vein_parity/intrinsic_reference_graph_rbf.py'
      - 'benchmarks/vein_parity/fold_midpoint_linear_drift_audit.py'
      - 'benchmarks/vein_parity/test_intrinsic_reference_graph_and_drift.py'
      - '.github/workflows/offline-intrinsic-vein-reference.yml'
  workflow_dispatch:
jobs:
  synthetic_regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent dependencies
        run: python -m pip install 'numpy<3' 'scipy>=1.14' 'trimesh>=4.4'
      - name: Test metric and drift surrogates without vendor data
        working-directory: benchmarks/vein_parity
        run: python -m unittest -v test_intrinsic_reference_graph_and_drift.py
