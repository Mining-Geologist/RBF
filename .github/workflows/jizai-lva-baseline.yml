name: Jizai Structural Orientation and Anisotropy Baseline
on:
  push:
    branches: [research/jizai-lva-baseline-20261015]
    paths:
      - ci/jizai_lva_baseline.py
      - ci/patch_jizai.py
      - .github/workflows/jizai-lva-baseline.yml
  workflow_dispatch:
jobs:
  lva-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      CC: /usr/bin/gcc-13
      CXX: /usr/bin/g++-13
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common build-essential cmake ninja-build pkg-config git curl zip unzip tar
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          python -m pip install --upgrade pip setuptools wheel numpy
      - name: Build patched upstream Jizai 1.0.0
        run: |
          git clone --depth 1 --branch v1.0.0 https://github.com/unageek/jizai.git jizai-src
          git -C jizai-src submodule update --init --recursive
          python ci/patch_jizai.py
          python -m pip install ./jizai-src
      - name: Numerical tests with synthetic data
        run: |
          python ci/jizai_lva_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jizai-lva-baseline-results
          path: jizai_lva_baseline/
          if-no-files-found: warn
