name: Offline vein and pinchout parity lab

on:
  push:
    branches: [research/vein-pinchout-parity-20261017]
    paths:
      - benchmarks/vein_parity/**
      - .github/workflows/offline-vein-parity-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-vein:
    name: Synthetic HW/FW, pinchout and closed volume
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source numerical libraries
        run: python -m pip install numpy scipy scikit-image trimesh
      - name: Execute six independent option test groups and export meshes
        working-directory: benchmarks/vein_parity
        run: python test_vein_parity_lab.py --out ../../vein-lab-output
      - name: Package original reconstruction and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-vein-proof-of-concept
          path: |
            vein-lab-output/
            benchmarks/vein_parity/vein_parity_lab.py
            benchmarks/vein_parity/test_vein_parity_lab.py
          retention-days: 15
