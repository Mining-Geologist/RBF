name: Compare Polatory and Jizai
on:
  push:
    branches: [fix/jizai-1.0.0-build]
    paths:
      - 'ci/benchmark_engines.py'
      - 'ci/patch_jizai.py'
      - '.github/workflows/benchmark-jizai.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        engine: [polatory, jizai]
    env:
      CC: /usr/bin/gcc-13
      CXX: /usr/bin/g++-13
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common build-essential cmake ninja-build pkg-config git curl zip unzip tar
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          python -m pip install --upgrade pip setuptools wheel numpy pybind11
      - name: Install original Polatory fork
        if: matrix.engine == 'polatory'
        run: python -m pip install --verbose .
      - name: Install patched Jizai 1.0.0
        if: matrix.engine == 'jizai'
        run: |
          git clone --depth 1 --branch v1.0.0 https://github.com/unageek/jizai.git jizai-src
          git -C jizai-src submodule update --init --recursive
          python ci/patch_jizai.py
          python -m pip install --verbose ./jizai-src
      - name: Run identical fitting and isosurface benchmark
        run: python ci/benchmark_engines.py ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.engine }}
          path: |
            ${{ matrix.engine }}_result.json
            ${{ matrix.engine }}_sphere.obj
          if-no-files-found: ignore
