name: Polatory benchmark lab

on:
  workflow_dispatch:
  push:
    branches:
      - feature/automatic-subdomainer

jobs:
  build-polatory:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cmake ninja build

      - name: Bootstrap vcpkg
        shell: powershell
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build and install Polatory
        shell: powershell
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          python -m pip install . --no-build-isolation --force-reinstall

      - name: Test Polatory import
        run: |
          python -c "import polatory; print('Polatory imported successfully')"
