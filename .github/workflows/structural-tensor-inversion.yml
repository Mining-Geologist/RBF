name: Structural LVA tensor inversion diagnostics

on:
  push:
    branches: [research/structural-tensor-inversion-20261016]
    paths:
      - benchmarks/leapfrog_gold/diagnose_structural_tensors.py
      - benchmarks/leapfrog_gold/validate_orientation_saved_domains.py
      - benchmarks/leapfrog_gold/infer_native_tie_choices.py
      - .github/workflows/structural-tensor-inversion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tensor-inversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric dependencies
        run: python -m pip install numpy scipy
      - name: Verify tensor inverse and blended tensor signatures
        run: python benchmarks/leapfrog_gold/diagnose_structural_tensors.py --self-test
      - name: Verify inverse tie identifiability controls
        run: python benchmarks/leapfrog_gold/infer_native_tie_choices.py --self-test
      - name: Check saved-project audit helper syntax
        run: python -m py_compile benchmarks/leapfrog_gold/validate_orientation_saved_domains.py
