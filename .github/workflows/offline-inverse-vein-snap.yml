name: Offline native asphere inverse snap proof

on:
  push:
    branches: [research/vein-pinchout-parity-20261017]
    paths:
      - benchmarks/vein_parity/invert_native_asphere_snap.py
      - benchmarks/vein_parity/test_invert_native_asphere_snap.py
      - .github/workflows/offline-inverse-vein-snap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-inversion:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python benchmarks/vein_parity/test_invert_native_asphere_snap.py
