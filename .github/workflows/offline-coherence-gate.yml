name: Offline experimental graph coherence gate

on:
  push:
    branches: [research/structural-tensor-inversion-20261016]
    paths:
      - 'benchmarks/leapfrog_gold/experimental_coherence_guard.py'
      - 'benchmarks/leapfrog_gold/test_experimental_coherence_guard.py'
      - '.github/workflows/offline-coherence-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy scikit-learn
      - run: python benchmarks/leapfrog_gold/test_experimental_coherence_guard.py
