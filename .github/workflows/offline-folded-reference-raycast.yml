name: Offline folded reference raycast polarity
on:
  push:
    branches:
      - research/vein-pinchout-parity-20261017
    paths:
      - 'benchmarks/vein_parity/reference_raycast_wall_polarity.py'
      - 'benchmarks/vein_parity/test_reference_raycast_wall_polarity.py'
      - '.github/workflows/offline-folded-reference-raycast.yml'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy trimesh
      - name: Verify branch-selection and fallback on synthetic geometry
        working-directory: benchmarks/vein_parity
        run: python -m unittest -v test_reference_raycast_wall_polarity.py
