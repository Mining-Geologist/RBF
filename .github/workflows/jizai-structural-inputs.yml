name: Structural Tensor and Indicator Unit Checks
on:
  push:
    branches: [research/jizai-lva-baseline-20261015]
    paths:
      - ci/jizai_structural_field.py
      - ci/test_jizai_structural_field.py
      - .github/workflows/jizai-structural-inputs.yml
  workflow_dispatch:
jobs:
  structural-input-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python ci/test_jizai_structural_field.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-input-regression-results
          path: jizai_structural_input_test.json
          if-no-files-found: warn
