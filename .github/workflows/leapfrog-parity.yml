name: Leapfrog parity

on:
  push:
    branches:
      - feature/leapfrog-parity
      - feature/automatic-subdomainer
  workflow_dispatch:

jobs:
  python-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev cmake ninja-build

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .

      - name: Run parity unit tests
        run: |
          python -m pip install pytest scipy
          python -m pytest -q \
            python/tests/test_automatic_domain_builder.py \
            python/tests/test_labeled_domain_builder.py \
            python/tests/test_leapfrog_values.py
