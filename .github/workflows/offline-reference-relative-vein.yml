name: Offline reference-relative vein interpolation

on:
  push:
    branches: [research/vein-pinchout-parity-20261017]
    paths:
      - benchmarks/vein_parity/reference_relative_wall_model.py
      - benchmarks/vein_parity/test_reference_relative_wall_model.py
      - .github/workflows/offline-reference-relative-vein.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - run: python benchmarks/vein_parity/test_reference_relative_wall_model.py
