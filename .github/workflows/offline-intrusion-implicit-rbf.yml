name: Offline 3D intrusion RBF audit
on:
  push:
    branches:
      - research/vein-pinchout-parity-20261017
    paths:
      - 'benchmarks/vein_parity/intrinsic_implicit_rbf3d_linear.py'
      - 'benchmarks/vein_parity/test_intrinsic_implicit_rbf3d_linear.py'
      - '.github/workflows/offline-intrusion-implicit-rbf.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent dependencies
        run: python -m pip install numpy scipy
      - name: Execute generic 3D radial-plus-affine tests
        working-directory: benchmarks/vein_parity
        run: python -m unittest -v test_intrinsic_implicit_rbf3d_linear.py
